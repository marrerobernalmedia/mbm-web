 d_h2:['Cómo enviarlo','How to send it'],

 d_pag:['Página','Page'], d_quitar:['Quitar página','Remove page'],
 d_listo:['PDF creado: ','PDF created: '], d_listo2:[' página(s). Guárdalo y súbelo desde el portal seguro.',' page(s). Save it and upload it from the secure portal.'],
 d_guardar:['Guardar el PDF','Save the PDF'],
 s_h:['Servicios','Services'], s_p:['Toca uno para ver qué necesitas y pedirlo.','Tap one to see what you need and request it.'],
 c_h:['Contacto','Contact'], c_p:['Estamos para ayudarte, en español e inglés.','We are here to help, in English and Spanish.'],
 c_tel:['Llamar a la oficina','Call the office'], c_cita:['Lunes, martes, jueves y viernes.','Monday, Tuesday, Thursday and Friday.'],
 c_dir:['Cómo llegar','Directions'], c_hor:['Horario','Hours'], c_hor2:['Lunes a viernes, de 9:00 AM a 5:00 PM (hora de Las Vegas).','Monday to Friday, 9:00 AM to 5:00 PM (Las Vegas time).'],
 c_web:['Abrir el sitio completo','Open the full website'],
 legal:['Marrero Bernal & Associates es una agencia de seguros independiente con licencia en Nevada, California y Arizona. No somos abogados y no ofrecemos asesoría legal.','Marrero Bernal & Associates is an independent insurance agency licensed in Nevada, California and Arizona. We are not attorneys and do not give legal advice.'],
 n_ini:['Inicio','Home'], n_doc:['Escanear','Scan'], n_serv:['Servicios','Services'], n_cont:['Contacto','Contact'],
 i_and:['Instala la app para tenerla a mano.','Install the app to keep it handy.'], i_btn:['Instalar','Install'],
 i_ios:['Para instalarla: toca Compartir y luego «Añadir a pantalla de inicio».','To install it: tap Share, then “Add to Home Screen”.']
};
const t=k=>T[k][L==='es'?0:1];

// ---------- enlaces (el sitio decide español o inglés por la ruta)
const RUTA={

const FUERA={portal:'https://marrerobernal.securefilepro.com/portal/#/login',pago:'https://55a7805c-ea2c-4f0e-951b-1aa3c932e857.paylinks.godaddy.com',wa:'https://wa.me/18888772583'};
const url=k=>FUERA[k]||SITE+RUTA[k][L==='es'?0:1];

const SERV=[
 ['🚗','Seguro de auto','Auto insurance','/seguro-de-auto/','/en/auto-insurance/'],
 ['🏠','Casa, condominio y renters','Home, condo and renters','/seguro-de-casa/','/en/home-insurance/'],
 ['❤️','Seguro de vida','Life insurance','/seguro-de-vida/','/en/life-insurance/'],
 ['🏗️','Workers’ comp y seguro de negocio','Workers’ comp and business insurance','/seguro-de-negocio/','/en/business-insurance/'],
 ['🩺','Obamacare · Nevada Health Link','Obamacare · Nevada Health Link','/obamacare-nevada/','/en/obamacare-nevada/'],

 ['🌎','Traducciones (DMV de Nevada)','Translations (Nevada DMV)','/traducciones/','/en/translations/'],

 ['📱','Protección de dispositivos','Device protection','/proteccion-de-dispositivos/','/en/device-protection/']
];

function pinta(){
 document.documentElement.lang=L;
 $$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 $$('[data-href]').forEach(a=>a.href=url(a.dataset.href));

 $('#servs').innerHTML=SERV.map(s=>`<a class="row" href="${SITE+(L==='es'?s[3]:s[4])}?app=1"><span class="ic">${s[0]}</span><b>${L==='es'?s[1]:s[2]}</b><span class="go">›</span></a>`).join('');
 pintaPags(); pintaInst();
}
$$('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;guarda.set('mba_lang',L);pinta()});

// ---------- navegación entre vistas (solo el ancla, para volver con el botón atrás)
function ir(v,push){
 if(!$('#v-'+v))v='inicio';
 $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));

// ---------- escáner: fotos → PDF armado en el teléfono
const pags=[]; // {blob,w,h,url}
function reducir(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{const M=1700,k=Math.min(1,M/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
  c.toBlob(b=>b?ok({blob:b,w,h,url:URL.createObjectURL(b)}):no(),'image/jpeg',.82)};
 im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
async function agrega(files){for(const f of files){try{pags.push(await reducir(f))}catch(e){}} $('#listo').hidden=true; pintaPags()}
$('#cam').onchange=e=>{agrega([...e.target.files]);e.target.value=''};

 $('#pags').innerHTML=pags.map((p,i)=>`<div class="pag"><img src="${p.url}" alt="${t('d_pag')} ${i+1}"><i>${i+1}</i><button data-q="${i}" aria-label="${t('d_quitar')} ${i+1}">×</button></div>`).join('');

}
$('#pags').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const p=pags.splice(+b.dataset.q,1)[0];URL.revokeObjectURL(p.url);$('#listo').hidden=true;pintaPags()});

async function armaPDF(){
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const put=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
 const obj=(n,body)=>{offs[n]=len;put(n+' 0 obj\n'+body+'\nendobj\n')};
 put('%PDF-1.4\n%âãÏÓ\n');
 const N=pags.length, kids=[];
 for(let i=0;i<N;i++)kids.push((3+i*3)+' 0 R');
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Count '+N+' /Kids ['+kids.join(' ')+'] >>');
 for(let i=0;i<N;i++){const p=pags[i],a=3+i*3,W=612,H=792,m=18;
  const k=Math.min((W-2*m)/p.w,(H-2*m)/p.h),w=p.w*k,h=p.h*k,x=(W-w)/2,y=(H-h)/2;
  const cont='q '+w.toFixed(2)+' 0 0 '+h.toFixed(2)+' '+x.toFixed(2)+' '+y.toFixed(2)+' cm /Im0 Do Q';
  obj(a,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+(a+2)+' 0 R >> >> /Contents '+(a+1)+' 0 R >>');
  obj(a+1,'<< /Length '+cont.length+' >>\nstream\n'+cont+'\nendstream');
  const jpg=new Uint8Array(await p.blob.arrayBuffer());
  offs[a+2]=len;put((a+2)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');put(jpg);put('\nendstream\nendobj\n');
 }
 const total=2+N*3,xref=len;
 let x='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
 for(let n=1;n<=total;n++)x+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
 put(x+'trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
 return new Blob(parts,{type:'application/pdf'});
}
let ultimo=null;
$('#pdf').onclick=async()=>{
 if(!pags.length)return; $('#pdf').disabled=true;
 const blob=await armaPDF(), d=new Date(), nombre='documentos-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.pdf';
 if(ultimo)URL.revokeObjectURL(ultimo); ultimo=URL.createObjectURL(blob);
 const file=new File([blob],nombre,{type:'application/pdf'});
 const box=$('#listo'); box.hidden=false;
 box.innerHTML='';
 const p=document.createElement('div'); p.textContent=t('d_listo')+nombre+' · '+pags.length+t('d_listo2'); box.appendChild(p);
 const b=document.createElement('button'); b.className='btn navy'; b.style.marginTop='10px'; b.textContent='💾 '+t('d_guardar'); box.appendChild(b);
 b.onclick=async()=>{
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nombre});return} }catch(e){ if(e&&e.name==='AbortError')return }
  const a=document.createElement('a'); a.href=ultimo; a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
 };
 $('#pdf').disabled=false; box.scrollIntoView({block:'center',behavior:'smooth'});
};

let aviso=null; const instalada=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone||!!window.Capacitor||document.referrer.indexOf('android-app://')===0;

function pintaInst(){
 const box=$('#inst'),tx=$('#inst-t'); if(instalada||guarda.get('mba_inst_x')){box.hidden=true;return}
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 if(aviso){tx.innerHTML='';tx.append(t('i_and')+' ');const b=document.createElement('button');b.className='btn acc';b.style.cssText='display:inline-flex;width:auto;min-height:36px;padding:6px 14px;margin-top:6px';b.textContent=t('i_btn');b.onclick=async()=>{aviso.prompt();aviso=null;box.hidden=true};tx.append(document.createElement('br'),b);box.hidden=false}
 else if(ios){tx.textContent=t('i_ios');box.hidden=false}
 else box.hidden=true;
}
$('#inst-x').onclick=()=>{guarda.set('mba_inst_x','1');$('#inst').hidden=true};

pinta(); ir((location.hash||'#inicio').slice(1));
