# Compila en la nube las apps de iPhone/iPad (El Home de la Risa, Recta Al Pecho y Marrero Bernal).
# Sin las claves de Apple: solo comprueba que compilan (simulador).
# Con los secretos APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID y ASC_KEY_P8: firma y sube a TestFlight.
name: Apps Apple

on:
  workflow_dispatch:
    inputs:
      subir:
        description: "Subir a TestFlight (necesita las claves de Apple)"
        type: boolean
        default: false
      intel:
        description: "Usar Mac Intel (cuando GitHub no tiene Mac arm64 libres)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["apple/**", ".github/workflows/apps-apple.yml"]

concurrency:
  group: apps-apple
  cancel-in-progress: true

jobs:
  ios:
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.intel) && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [elhome, recta, mba]
    env:
      SUBIR: ${{ github.event_name == 'workflow_dispatch' && inputs.subir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)" || true
          xcodebuild -version
      - name: Preparar proyecto
        working-directory: apple/${{ matrix.app }}
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios
      - name: Compilar (simulador, sin firmar)
        if: env.SUBIR != 'true'
        working-directory: apple/${{ matrix.app }}/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" = 0
      - name: Compilar para iPhone real (sin firmar)
        if: env.SUBIR != 'true'
        working-directory: apple/${{ matrix.app }}/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test "${PIPESTATUS[0]}" = 0
      - name: Firmar y subir a TestFlight
        if: env.SUBIR == 'true'
        working-directory: apple/${{ matrix.app }}/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"; printf '%s' "$KEY_P8" > "$KEY"
          # Diagnóstico de la clave (no imprime secretos): formato del .p8 y respuesta de Apple.
          echo "Key ID: ${#KEY_ID} caracteres · Issuer: ${#ISSUER} caracteres · líneas del .p8: $(wc -l < "$KEY" | tr -d ' ') · CR: $(grep -c $'\r' "$KEY" || true)"
          head -1 "$KEY" | grep -q "BEGIN PRIVATE KEY" && echo "p8: cabecera correcta" || echo "p8: FALTA la línea BEGIN PRIVATE KEY"
          tr -d '\r' < "$KEY" > "$KEY.lf" && mv "$KEY.lf" "$KEY"
          KEY="$KEY" ruby -ropenssl -rbase64 -rjson -rnet/http -e '
            key=OpenSSL::PKey.read(File.read(ENV["KEY"]))
            b=->(s){Base64.urlsafe_encode64(s,padding:false)}
            h=b.({alg:"ES256",kid:ENV["KEY_ID"],typ:"JWT"}.to_json)
            c=b.({iss:ENV["ISSUER"],iat:Time.now.to_i,exp:Time.now.to_i+600,aud:"appstoreconnect-v1"}.to_json)
            der=key.sign("SHA256","#{h}.#{c}")
            sig=OpenSSL::ASN1.decode(der).value.map{|i| i.value.to_s(2).rjust(32,"\0")}.join
            u=URI("https://api.appstoreconnect.apple.com/v1/apps?limit=1")
            r=Net::HTTP.start(u.host,443,use_ssl:true){|x| x.get(u.request_uri,{"Authorization"=>"Bearer #{h}.#{c}.#{b.(sig)}"})}
            puts "App Store Connect API responde: #{r.code}"
            unless r.code=="200"; puts r.body[0,400]; exit 1; end
          '
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          BUILD=$(( $(date +%s) / 60 ))
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= PROVISIONING_PROFILE= archive | tail -60
          # El archivo se firma "ad hoc" (sin perfil de desarrollo, que exigiría un iPhone registrado);
          # la firma de distribución la pone Apple al exportar (firma en la nube con la clave de API).
          codesign -d --entitlements - "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" 2>/dev/null | head -20 || true
          cp ../../../ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH | tail -60
