name: Ficha App Store
# Sube a App Store Connect los textos, la categoría, las capturas y los datos del revisor
# de las tres apps (apple/tienda/<app>). No compila ni sube binarios.
on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps (elhome, recta, mba) separadas por coma"
        default: "elhome,recta,mba"
      sin_capturas:
        description: "No volver a subir las capturas"
        type: boolean
        default: false
      enviar:
        description: "ENVIAR A REVISIÓN de Apple (solo con el sí de Eliam)"
        type: boolean
        default: false
      clave_publica:
        description: "Solo mostrar la clave pública (para cifrar adjuntos privados)"
        type: boolean
        default: false
jobs:
  clave:
    if: inputs.clave_publica
    runs-on: ubuntu-latest
    steps:
      - name: Clave pública (no es secreta)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" | tr -d '\r' > k.p8
          openssl pkey -in k.p8 -pubout -outform DER | xxd -p -c 200 | sed 's/^/PUB:/'
          rm -f k.p8
  ficha:
    if: ${{ !inputs.clave_publica }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [elhome, recta, mba]
    steps:
      - uses: actions/checkout@v4
      - name: ¿Toca esta app?
        id: toca
        run: |
          case ",${{ inputs.apps }}," in *",${{ matrix.app }},"*) echo "si=true" >> "$GITHUB_OUTPUT";; *) echo "si=false" >> "$GITHUB_OUTPUT";; esac
      - uses: ruby/setup-ruby@v1
        if: steps.toca.outputs.si == 'true'
        with:
          ruby-version: "3.3"
      - name: Subir la ficha
        if: steps.toca.outputs.si == 'true'
        working-directory: apple/tienda
        env:
          APP: ${{ matrix.app }}
          ENVIAR: ${{ inputs.enviar }}
          SIN_CAPTURAS: ${{ inputs.sin_capturas }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          set -a; . "./$APP/app.env"; set +a
          # Adjunto privado para el revisor: viaja cifrado en el repositorio y se descifra aquí.
          if [ -f "$APP/carta.enc" ]; then
            printf '%s' "$ASC_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/k.p8"
            openssl pkeyutl -derive -inkey "$RUNNER_TEMP/k.p8" -peerkey "$APP/carta.eph.pem" -out "$RUNNER_TEMP/s.bin"
            K=$(openssl dgst -sha256 -binary "$RUNNER_TEMP/s.bin" | xxd -p -c 64)
            openssl enc -d -aes-256-cbc -K "$K" -iv "$(cat "$APP/carta.iv")" -in "$APP/carta.enc" -out "$APP/carta_autorizacion.pdf"
            rm -f "$RUNNER_TEMP/k.p8" "$RUNNER_TEMP/s.bin"
            echo "$(cat "$APP/carta.sha256")  $APP/carta_autorizacion.pdf" | sha256sum -c -
          fi
          gem install fastlane --no-document -q
          fastlane ficha
