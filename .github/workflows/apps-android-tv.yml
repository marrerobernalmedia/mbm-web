# Compila en la nube la app de Android TV / Google TV de El Home de la Risa (android/elhome-tv).
# Sin la llave: compila sin firmar (solo para comprobar). Con los secretos ANDROID_KEYSTORE_B64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD (la llave de subida de Google Play
# de El Home), firma el .aab listo para subir a la pista de Android TV en Play Console.
name: App Android TV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/elhome-tv/**", ".github/workflows/apps-android-tv.yml"]

concurrency:
  group: apps-android-tv
  cancel-in-progress: true

jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar proyecto
        working-directory: android/elhome-tv
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
      - name: Llave de firma (si está)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/subida.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/subida.keystore" >> "$GITHUB_ENV"
            echo "Firma: SÍ"
          else
            echo "Firma: NO (faltan los secretos; sale sin firmar)"
          fi
      - name: Compilar .aab y .apk
        working-directory: android/elhome-tv/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$(( $(date +%s) / 60 ))
          echo "versionCode $VERSION_CODE"
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          ls -la app/build/outputs/bundle/release app/build/outputs/apk/release
      - uses: actions/upload-artifact@v4
        with:
          name: elhome-tv
          path: |
            android/elhome-tv/android/app/build/outputs/bundle/release/*.aab
            android/elhome-tv/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
